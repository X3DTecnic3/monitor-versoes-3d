<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Versões — Scanners, Geomagic &amp; 3D Systems</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --new-bg: rgba(34, 197, 94, 0.14);
      --new-border: #22c55e;
      --new-text: #4ade80;
      --err-bg: rgba(245, 158, 11, 0.14);
      --err-border: #f59e0b;
      --err-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.65rem;
      margin-bottom: 0.35rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .meta + .meta {
      margin-top: 0.2rem;
    }

    .banner-novidades {
      display: none;
      background: var(--new-bg);
      border: 1px solid var(--new-border);
      color: var(--new-text);
      padding: 0.85rem 1.1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .subfiltros {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1.5rem;
      padding: 0.55rem 0.75rem;
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .subfiltros.visivel {
      display: flex;
    }

    .subfiltros-rotulo {
      font-size: 0.78rem;
      color: var(--muted);
      margin-right: 0.25rem;
    }

    .btn-filtro {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: 0.15s ease;
    }

    .btn-filtro:hover {
      border-color: var(--accent);
    }

    .btn-filtro.ativo {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-subfiltro {
      padding: 0.32rem 0.75rem;
      font-size: 0.82rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .cartao {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.9rem;
    }

    .cartao.nova-versao {
      border-color: var(--new-border);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.25);
    }

    .topo-cartao {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .fabricante {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .titulo-software {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 0.15rem;
    }

    .badge-novo {
      background: var(--new-border);
      color: #052e16;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .versao-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
    }

    .versao-label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .versao-valor {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-word;
    }

    .alerta-erro {
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: var(--err-text);
      font-size: 0.78rem;
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
    }

    .rodape-cartao {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .link-download {
      color: var(--text);
      background: #0284c7;
      text-decoration: none;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .link-download:hover {
      background: #0369a1;
    }

    .aviso-local {
      background: var(--err-bg);
      border: 1px solid var(--err-border);
      color: var(--err-text);
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
      font-size: 0.92rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.25rem 0.75rem 3rem;
      }

      h1 {
        font-size: 1.35rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .rodape-cartao {
        flex-direction: column;
        align-items: flex-start;
      }

      .link-download {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Monitor de Versões de Software</h1>
      <p class="meta" id="ultima-atualizacao">A carregar dados...</p>
      <p class="meta" id="proxima-atualizacao"></p>
    </header>

    <div class="banner-novidades" id="banner-novidades"></div>

    <div class="filtros" id="filtros">
      <button class="btn-filtro ativo" data-filtro="todos">Todos</button>
      <button class="btn-filtro" data-filtro="Shining 3D">Shining 3D</button>
      <button class="btn-filtro" data-filtro="Hexagon / Geomagic">Hexagon / Geomagic</button>
      <button class="btn-filtro" data-filtro="3D Systems">3D Systems</button>
    </div>

    <div class="subfiltros" id="subfiltros-shining">
      <span class="subfiltros-rotulo">Subgrupo Shining 3D:</span>
      <button class="btn-filtro btn-subfiltro ativo" data-subfiltro="todos">Todos</button>
      <button class="btn-filtro btn-subfiltro" data-subfiltro="EinStar">EinStar</button>
      <button class="btn-filtro btn-subfiltro" data-subfiltro="EinScan">EinScan</button>
      <button class="btn-filtro btn-subfiltro" data-subfiltro="FreeScan">FreeScan</button>
    </div>

    <main class="grid" id="lista-softwares"></main>
    <div id="mensagem-erro"></div>
  </div>

  <script>
    let todosSoftwares = [];
    let filtroAtual = "todos";
    let subfiltroShining = "todos";

    function limparTexto(valor) {
      return String(valor || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function normalizarFabricante(item) {
      const fab = limparTexto(item.fabricante);
      const combinado = `${limparTexto(item.id)} ${limparTexto(item.nome)} ${limparTexto(item.url)}`;

      if (
        fab.includes("3d systems") ||
        fab.includes("3dsystems") ||
        combinado.includes("3dsystems") ||
        combinado.includes("3d-sprint") ||
        combinado.includes("3d sprint")
      ) {
        return "3D Systems";
      }

      if (
        fab.includes("geomagic") ||
        fab.includes("hexagon") ||
        combinado.includes("geomagic")
      ) {
        return "Hexagon / Geomagic";
      }

      if (
        fab.includes("shining") ||
        fab.includes("einscan") ||
        fab.includes("einstar") ||
        fab.includes("freescan") ||
        combinado.includes("shining3d") ||
        combinado.includes("einstar") ||
        combinado.includes("starvision") ||
        combinado.includes("exstar") ||
        combinado.includes("freescan") ||
        combinado.includes("einscan") ||
        combinado.includes("exscan") ||
        combinado.includes("exmodel") ||
        combinado.includes("transcan")
      ) {
        return "Shining 3D";
      }

      return item.fabricante || "Shining 3D";
    }

    function obterSubgrupoShining(item) {
      const texto = `${limparTexto(item.id)} ${limparTexto(item.nome)} ${limparTexto(item.url)}`;

      if (
        texto.includes("einstar") ||
        texto.includes("starvision") ||
        texto.includes("exstar")
      ) {
        return "EinStar";
      }

      if (texto.includes("freescan")) {
        return "FreeScan";
      }

      return "EinScan";
    }

    function formatarData(isoString) {
      if (!isoString) return "Sem registo";
      const data = new Date(isoString);
      if (Number.isNaN(data.getTime())) return isoString;
      return data.toLocaleString("pt-PT", {
        dateStyle: "short",
        timeStyle: "short"
      });
    }

    function formatarProximaAtualizacao(isoString) {
      const intervaloMs = 60 * 60 * 1000;
      const agora = Date.now();

      if (!isoString) {
        return "Próxima verificação automática: daqui a ~1h";
      }

      const ultima = new Date(isoString).getTime();
      if (Number.isNaN(ultima)) {
        return "Próxima verificação automática: daqui a ~1h";
      }

      let proxima = ultima + intervaloMs;
      while (proxima <= agora) {
        proxima += intervaloMs;
      }

      const horasRestantes = Math.max(1, Math.ceil((proxima - agora) / intervaloMs));
      const horaFormatada = new Date(proxima).toLocaleTimeString("pt-PT", {
        hour: "2-digit",
        minute: "2-digit"
      });

      return `Próxima verificação automática: daqui a ~${horasRestantes}h (por volta das ${horaFormatada})`;
    }

    function atualizarVisibilidadeSubfiltros() {
      const subBox = document.getElementById("subfiltros-shining");
      if (filtroAtual === "Shining 3D") {
        subBox.classList.add("visivel");
      } else {
        subBox.classList.remove("visivel");
      }
    }

    function renderizar() {
      atualizarVisibilidadeSubfiltros();

      const grid = document.getElementById("lista-softwares");
      const banner = document.getElementById("banner-novidades");

      const ordemFabricante = {
        "Shining 3D": 1,
        "Hexagon / Geomagic": 2,
        "3D Systems": 3
      };

      const filtrados = todosSoftwares.filter((item) => {
        const fab = normalizarFabricante(item);
        if (filtroAtual !== "todos" && fab !== filtroAtual) {
          return false;
        }
        if (filtroAtual === "Shining 3D" && subfiltroShining !== "todos") {
          return obterSubgrupoShining(item) === subfiltroShining;
        }
        return true;
      });

      const filtradosOrdenados = [...filtrados].sort((a, b) => {
        const aNova = a.nova_versao ? 1 : 0;
        const bNova = b.nova_versao ? 1 : 0;

        if (aNova !== bNova) {
          return bNova - aNova;
        }

        const fabA = ordemFabricante[normalizarFabricante(a)] ?? 99;
        const fabB = ordemFabricante[normalizarFabricante(b)] ?? 99;
        if (fabA !== fabB) {
          return fabA - fabB;
        }

        if (aNova === 1 && bNova === 1) {
          const dataA = new Date(a.data_ultima_atualizacao || 0).getTime();
          const dataB = new Date(b.data_ultima_atualizacao || 0).getTime();
          return dataB - dataA;
        }

        return 0;
      });

      const novidades = todosSoftwares.filter((item) => Boolean(item.nova_versao));
      if (novidades.length > 0) {
        banner.style.display = "block";
        banner.textContent = `Aviso: ${novidades.length} software(s) com atualização marcada como nova (${novidades.map(n => n.nome).join(", ")}).`;
      } else {
        banner.style.display = "none";
      }

      grid.innerHTML = filtradosOrdenados.map((item) => {
        const isNova = Boolean(item.nova_versao);
        const versao = item.versao_atual || "Não detetada";
        const dataVerificacao = item.ultima_verificacao || item.data_ultima_atualizacao;
        const fabTexto = normalizarFabricante(item);

        return `
          <article class="cartao ${isNova ? "nova-versao" : ""}">
            <div>
              <div class="topo-cartao">
                <div>
                  <div class="fabricante">${fabTexto}</div>
                  <div class="titulo-software">${item.nome}</div>
                </div>
                ${isNova ? `<span class="badge-novo">NOVA VERSÃO</span>` : ""}
              </div>

              <div class="versao-box" style="margin-top: 0.85rem;">
                <div class="versao-label">Versão atual</div>
                <div class="versao-valor">${versao}</div>
              </div>

              ${item.ultimo_erro ? `
                <div class="alerta-erro" style="margin-top: 0.65rem;">
                  Falha na última leitura: ${item.ultimo_erro}
                </div>
              ` : ""}
            </div>

            <div class="rodape-cartao">
              <span>Verificado: ${formatarData(dataVerificacao)}</span>
              <a class="link-download" href="${item.url}" target="_blank" rel="noopener noreferrer">
                Página oficial
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    async function iniciar() {
      const metaEl = document.getElementById("ultima-atualizacao");
      const proxEl = document.getElementById("proxima-atualizacao");
      const erroEl = document.getElementById("mensagem-erro");

      try {
        const resposta = await fetch("./versoes.json", { cache: "no-store" });
        if (!resposta.ok) {
          throw new Error(`HTTP ${resposta.status}`);
        }
        const dados = await resposta.json();
        todosSoftwares = dados.softwares || [];
        metaEl.textContent = `Última verificação automática: ${formatarData(dados.atualizado_em)}`;
        proxEl.textContent = formatarProximaAtualizacao(dados.atualizado_em);
        renderizar();
      } catch (erro) {
        metaEl.textContent = "Não foi possível ler o versoes.json";
        proxEl.textContent = "";
        erroEl.innerHTML = `
          <div class="aviso-local">
            <strong>Nota ao abrir localmente:</strong> muitos navegadores bloqueiam a leitura de ficheiros locais (<code>versoes.json</code>) quando abres o <code>index.html</code> com duplo clique (<code>file://</code>).
            Assim que o colocares num servidor local ou no <strong>GitHub Pages</strong>, ele carrega automaticamente.
          </div>
        `;
      }
    }

    document.getElementById("filtros").addEventListener("click", (evento) => {
      const botao = evento.target.closest(".btn-filtro");
      if (!botao) return;

      document.querySelectorAll("#filtros .btn-filtro").forEach((b) => b.classList.remove("ativo"));
      botao.classList.add("ativo");
      filtroAtual = botao.dataset.filtro;

      if (filtroAtual !== "Shining 3D") {
        subfiltroShining = "todos";
        document.querySelectorAll("#subfiltros-shining .btn-subfiltro").forEach((b) => {
          b.classList.toggle("ativo", b.dataset.subfiltro === "todos");
        });
      }

      renderizar();
    });

    document.getElementById("subfiltros-shining").addEventListener("click", (evento) => {
      const botao = evento.target.closest(".btn-subfiltro");
      if (!botao) return;

      document.querySelectorAll("#subfiltros-shining .btn-subfiltro").forEach((b) => b.classList.remove("ativo"));
      botao.classList.add("ativo");
      subfiltroShining = botao.dataset.subfiltro;
      renderizar();
    });

    iniciar();
  </script>
</body>
</html>
